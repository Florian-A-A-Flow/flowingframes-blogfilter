<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>

<style>
/* ----------------------------------------
   GLOBAL (an Fluid/Omnes angelehnt)
---------------------------------------- */
body {
  margin: 0;
  padding: 40px;
  background: #111;
  color: #fff;
  font-family: var(--font-primary); /* Squarespace: Omnes Pro / Primary Font */
}

/* Wrapper */
#portfolio-wrapper {
  max-width: 1300px;
  margin: 0 auto;
}

/* Filter-Bar */
#filterBar {
  margin-bottom: 35px;
}

.filter-group label {
  font-weight: 600;
  margin-right: 25px;
  cursor: pointer;
  font-size: 14px;
  opacity: 0.85;
}

.filter-group input {
  margin-right: 6px;
}

/* Grid */
.portfolio-grid {
  display: grid;
  gap: 50px;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
}

/* Card-Struktur */
.card {
  display: block;
  text-decoration: none;
  color: inherit;
}

.card-inner {
  border-radius: 10px;
  overflow: hidden;
  transform-origin: center center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover .card-inner {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 18px 40px rgba(0,0,0,0.45);
}

/* Bild + Hover-Zoom im Rahmen */
.card-img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

.card:hover .card-img {
  transform: scale(1.06);
  opacity: 0.9;
}

/* Textbereich */
.card-text {
  padding-top: 14px;
}

.card-category {
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 1px;
  opacity: 0.65;
  margin-bottom: 4px;
}

.card-title {
  font-size: 22px;
  font-weight: 600;
  margin: 4px 0;
}

.card-excerpt {
  font-size: 14px;
  opacity: 0.8;
}

/* Load-More Button */
#loadMoreBtn {
  margin: 50px auto 0;
  display: block;
  padding: 14px 26px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  background: #fff;
  color: #000;
  transition: background 0.25s ease, transform 0.25s ease;
}

#loadMoreBtn:hover {
  background: #ddd;
  transform: translateY(-1px);
}
</style>
</head>
<body>

<div id="portfolio-wrapper">

  <!-- FILTER -->
  <div id="filterBar">
    <div class="filter-group" id="categoryFilters">
      <label><input type="checkbox" value="Musikvideo"> Musikvideo</label>
      <label><input type="checkbox" value="Personenfotografie"> Personenfotografie</label>
      <label><input type="checkbox" value="Konzertfotografie"> Konzertfotografie</label>
      <label><input type="checkbox" value="Livesession"> Livesession</label>
      <label><input type="checkbox" value="Konzertvideo"> Konzertvideo</label>
      <label><input type="checkbox" value="Real Estate Fotografie"> Real Estate Fotografie</label>
      <label><input type="checkbox" value="Produktfotografie"> Produktfotografie</label>
    </div>
  </div>

  <!-- GRID -->
  <div class="portfolio-grid" id="portfolioGrid"></div>

  <!-- LOAD MORE -->
  <button id="loadMoreBtn">Mehr laden</button>

</div>

<script>
/* ----------------------------------------
   CONFIG
---------------------------------------- */
const PROXY = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";
const FEED  = "https://www.flowingframes.media/all-projekte?format=json-pretty";
const BASE_URL = "https://www.flowingframes.media";  // ← für funktionierende Links

let allPosts = [];
let visibleCount = 0;
const CHUNK = 12;

/* ----------------------------------------
   LOAD POSTS
---------------------------------------- */
async function loadPosts() {
  try {
    const res = await fetch(PROXY + FEED);
    const text = await res.text();

    // Wenn Proxy z.B. HTML-Fehler zurückgibt
    if (!text.trim().startsWith('{')) {
      console.error("Proxy liefert kein JSON:", text.slice(0, 200));
      return;
    }

    const data = JSON.parse(text);
    allPosts = Array.isArray(data.items) ? data.items : [];
    visibleCount = 0;

    renderPosts(true);

  } catch (err) {
    console.error("Fetch-Fehler:", err);
  }
}

/* ----------------------------------------
   RENDER POSTS
---------------------------------------- */
function renderPosts(reset = false) {
  const grid = document.getElementById("portfolioGrid");

  const selectedCats = [...document.querySelectorAll("#categoryFilters input:checked")]
    .map(cb => cb.value);

  let posts = allPosts;

  if (selectedCats.length > 0) {
    posts = posts.filter(p =>
      Array.isArray(p.categories) &&
      p.categories.some(cat => selectedCats.includes(cat))
    );
  }

  if (reset) {
    visibleCount = Math.min(CHUNK, posts.length);
  } else {
    visibleCount = Math.min(visibleCount + CHUNK, posts.length);
  }

  const slice = posts.slice(0, visibleCount);

  grid.innerHTML = "";

  slice.forEach(p => {
    const img  = p.assetUrl || "";
    const cat  = Array.isArray(p.categories) ? p.categories.join(", ") : "";
    const url  = BASE_URL + (p.fullUrl || "");
    const title = p.title || "";

    // Excerpt aus HTML zu Text konvertieren
    let excerptText = "";
    if (p.excerpt) {
      const tmp = document.createElement("div");
      tmp.innerHTML = p.excerpt;
      excerptText = (tmp.textContent || tmp.innerText || "").trim();
    }

    grid.innerHTML += `
      <a class="card" href="${url}">
        <div class="card-inner">
          <img class="card-img" src="${img}" alt="${title}">
          <div class="card-text">
            <div class="card-category">${cat}</div>
            <div class="card-title">${title}</div>
            ${excerptText ? `<div class="card-excerpt">${excerptText}</div>` : ""}
          </div>
        </div>
      </a>
    `;
  });

  // Button ausblenden, wenn nichts mehr zu laden ist
  const btn = document.getElementById("loadMoreBtn");
  if (visibleCount >= posts.length) {
    btn.style.display = "none";
  } else {
    btn.style.display = "block";
  }
}

/* ----------------------------------------
   EVENTS
---------------------------------------- */
document.getElementById("loadMoreBtn").addEventListener("click", () => {
  renderPosts(false);
});

document.querySelectorAll("#categoryFilters input").forEach(cb => {
  cb.addEventListener("change", () => {
    renderPosts(true);
  });
});

/* Init */
loadPosts();
</script>

</body>
</html>
