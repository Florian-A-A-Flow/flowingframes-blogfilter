<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- Omnes Pro Einbindung (Basic-Plan kompatibel) -->
<style>
@font-face {
    font-family: 'Omnes Pro';
    src: url('https://florian-a-a-flow.github.io/flowingframes-blogfilter/omnes-pro-400.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

body {
    background: #111;
    font-family: 'Omnes Pro', sans-serif;
    margin: 0;
    padding: 40px;
    color: #fff;
}

/* Filter Bar */
#filterBar {
  margin-bottom: 40px;
}
#filterBar label {
  font-size: 18px;
  margin-right: 25px;
  cursor: pointer;
}
#filterBar input {
  margin-right: 6px;
}

/* Grid */
.portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 45px;
}

/* Card */
.card {
    display: block;
    color: white;
    text-decoration: none;
    transition: opacity .25s;
}
.card:hover {
    opacity: .65;
}
.card-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 8px;
}
.card-category {
    margin-top: 14px;
    font-size: 13px;
    text-transform: uppercase;
    opacity: .55;
}
.card-title {
    font-size: 28px;
    margin: 2px 0 6px 0;
}
.card-excerpt {
    font-size: 16px;
    opacity: .75;
}

/* Load More */
#loadMore {
    margin: 60px auto;
    display: block;
    background: #fff;
    color: #111;
    padding: 16px 35px;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
    border: none;
}
</style>
</head>


<body>

<!-- FILTER -->
<div id="filterBar">
    <label><input type="checkbox" value="musikvideo"> Musikvideo</label>
    <label><input type="checkbox" value="personenfotografie"> Personenfotografie</label>
    <label><input type="checkbox" value="konzertfotografie"> Konzertfotografie</label>
    <label><input type="checkbox" value="livesession"> Livesession</label>
    <label><input type="checkbox" value="konzertvideo"> Konzertvideo</label>
    <label><input type="checkbox" value="real-estate-fotografie"> Real Estate Fotografie</label>
    <label><input type="checkbox" value="produktfotografie"> Produktfotografie</label>
</div>

<!-- GRID -->
<div id="portfolioGrid" class="portfolio-grid"></div>

<button id="loadMore">Mehr laden</button>




<script>
const API_URL = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=https://www.flowingframes.media/all?format=json-pretty";

let allPosts = [];
let currentIndex = 0;
const batchSize = 12;

// 1) Load from API
async function loadPosts() {
    const response = await fetch(API_URL);
    const data = await response.json();

    // squarespace feed structure
    allPosts = data.items || [];
    allPosts.sort((a,b) => b.publishOn - a.publishOn);

    renderPosts();
}

function renderPosts() {
    const subset = allPosts.slice(currentIndex, currentIndex + batchSize);
    currentIndex += batchSize;

    drawGrid(subset);
}

function drawGrid(posts) {
    const grid = document.getElementById("portfolioGrid");

    posts.forEach(p => {

        let dateObj = new Date(p.publishOn * 1000);

        let card = document.createElement("a");
        card.className = "card";
        card.href = p.fullUrl;
        card.target = "_top";

        card.innerHTML = `
            <img class="card-img" src="${p.assetUrl}" />
            <div class="card-category">${(p.categories || []).join(", ")}</div>
            <div class="card-title">${p.title}</div>
            <div class="card-excerpt">${p.excerpt || ""}</div>
        `;

        grid.appendChild(card);
    });
}


// FILTERING
document.querySelectorAll("#filterBar input").forEach(cb => {
    cb.addEventListener("change", applyFilter);
});

function applyFilter() {
    const active = [...document.querySelectorAll("#filterBar input:checked")].map(c => c.value.toLowerCase());

    const grid = document.getElementById("portfolioGrid");
    grid.innerHTML = "";

    let filtered = allPosts;

    if (active.length > 0) {
        filtered = allPosts.filter(p =>
            (p.categories || [])
                .map(c => c.toLowerCase())
                .some(cat => active.includes(cat))
        );
    }

    currentIndex = 0;
    drawGrid(filtered.slice(0, batchSize));
}


// LOAD MORE
document.getElementById("loadMore").addEventListener("click", () => {
    renderPosts();
});

// Init
loadPosts();
</script>

</body>
</html>
