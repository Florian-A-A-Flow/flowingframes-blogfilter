<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Font – möglichst nah an deinem Squarespace-Look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="portfolio.css" />
</head>
<body>
  <div id="portfolio-wrapper">
    <!-- Filter-Bar -->
    <section id="filterBar">
      <div class="filter-heading">Kategorien</div>
      <div id="categoryFilters" class="filter-group">
        <!-- wird von JS dynamisch mit Checkboxen gefüllt -->
      </div>
    </section>

    <!-- Grid -->
    <section class="portfolio-grid" id="portfolioGrid">
      <!-- Cards werden von JS eingefügt -->
    </section>

    <!-- Load More -->
    <button id="loadMoreBtn" class="load-more" style="display:none;">
      ALLE ANZEIGEN
    </button>
  </div>

  <script src="portfolio.js"></script>
</body>
</html>
