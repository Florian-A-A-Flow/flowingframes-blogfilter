<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* -----------------------------------------------------------
   DESIGN CORE — Apple-Inspired Modern Glass
----------------------------------------------------------- */
:root {
  --bg: #1C1C1C;

  --glass-bg: rgba(28,28,28,0.55);
  --glass-border: rgba(255,255,255,0.10);
  --glass-border-strong: rgba(255,255,255,0.18);

  --text-main: #F5F5F5;
  --text-muted: #A0A0A0;

  --pill-radius: 999px;
  --card-radius: 14px;

  --shadow-hover: 0 8px 22px rgba(0,0,0,0.40);
  --shadow-glass: 0 6px 24px rgba(0,0,0,0.45);

  --transition: 0.22s ease-out;
}

/* RESET --------------------------------------------------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 40px 0 120px;
  background: var(--bg);
  color: var(--text-main);
  font-family: system-ui, Helvetica, Arial, sans-serif;
}
a { text-decoration: none; color: inherit; }

/* WRAPPER ------------------------------------------------- */
#portfolio-wrapper {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 16px;
}

/* -----------------------------------------------------------
   FILTER BAR — Desktop (Flat Minimalist)
----------------------------------------------------------- */

#filterBar {
  margin-bottom: 32px;
  padding: 12px 0;
  position: relative;
}

.filter-group-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--text-muted);
  margin-bottom: 12px;
}

#categoryFilters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, auto));
  gap: 12px;
}

/* -----------------------------------------------------------
   FILTER PILLS — Variable Width (Fix for long entries)
----------------------------------------------------------- */

.filter-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 7px 16px;
  max-width: 100%;             /* verhindert Überlaufen */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  border-radius: var(--pill-radius);
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);

  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--text-muted);

  transition: var(--transition);
  cursor: pointer;
}

.filter-pill:hover {
  background: rgba(255,255,255,0.09);
  border-color: var(--glass-border-strong);
}

.filter-pill.active {
  background: rgba(255,255,255,0.17);
  border-color: rgba(255,255,255,0.45);
  color: white;
}

.filter-pill input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* -----------------------------------------------------------
   GRID + CARDS
----------------------------------------------------------- */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 34px;
}

.card {
  display: block;
  background: #1B1B1B;
  border-radius: var(--card-radius);
  overflow: hidden;

  opacity: 0;
  transform: translateY(20px);
  transition: .65s ease, box-shadow .35s ease;
}

.card.visible {
  opacity: 1;
  transform: translateY(0);
}

.card:hover {
  box-shadow: var(--shadow-hover);
}

.card-media-wrap {
  position: relative;
  overflow: hidden;
}

.card-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  transition: .45s ease;
}

.card:hover .card-img {
  transform: scale(1.06);
}

.card-media-overlay {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(circle at center,
               transparent 0%, rgba(0,0,0,0.35) 80%);
  transition: opacity .45s ease;
}

.card:hover .card-media-overlay {
  opacity: 1;
}

.card-text {
  padding: 18px;
}

.card-category {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.card-title {
  font-size: 20px;
  margin: 0 0 6px;
  font-weight: 600;
}

.card-excerpt {
  font-size: 13px;
  color: var(--text-muted);
  margin: 0;
}

/* -----------------------------------------------------------
   STATUS
----------------------------------------------------------- */
#statusMessage {
  text-align: center;
  margin-top: 24px;
  color: var(--text-muted);
}

/* -----------------------------------------------------------
   MOBILE — Glass Sticky Bar (Modern)
----------------------------------------------------------- */
@media (max-width: 768px) {

  body { padding-bottom: 160px; }

  #filterBar {
    position: sticky;
    top: 100px;
    background: var(--glass-bg);
    backdrop-filter: blur(18px) saturate(180%);

    border: 1px solid var(--glass-border);
    border-left: none;
    border-right: none;

    padding: 12px 14px;
    margin: 0 -16px 20px;
    z-index: 40;

    box-shadow: var(--shadow-glass);
  }

  #filterBar.compact {
    backdrop-filter: blur(22px) saturate(220%);
    padding: 7px 12px;
  }

  .filter-group-label { display: none; }

  #categoryFilters {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  #categoryFilters::-webkit-scrollbar { display: none; }

  .filter-pill {
    padding: 8px 18px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div id="portfolio-wrapper">

  <div id="filterBar">
    <div class="filter-group">
      <div class="filter-group-label">Kategorien</div>
      <div id="categoryFilters"></div>
    </div>
  </div>

  <div id="portfolioGrid" class="portfolio-grid"></div>
  <div id="statusMessage"></div>

</div>

<script>
/* ============================================================
   ENGINE — Sorted by Count + Infinite Scroll
============================================================ */

(function() {

  const BASE  = "https://www.flowingframes.media";
  const PROXY = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";

  let allPosts = [];
  let nextPath = "/all-projekte?format=json-pretty";
  let activeCategories = new Set();

  const gridEl    = document.getElementById("portfolioGrid");
  const filtersEl = document.getElementById("categoryFilters");
  const statusEl  = document.getElementById("statusMessage");
  const filterBarEl = document.getElementById("filterBar");

  let visibleCount = 0;
  const BATCH = 30;

  async function fetchPage(path) {
    const res = await fetch(PROXY + encodeURIComponent(BASE + path));
    return res.json();
  }

  async function loadInitial() {
    statusEl.textContent = "Lade Projekte …";

    while (nextPath && allPosts.length < 100) {
      const data = await fetchPage(nextPath);
      allPosts.push(...(data.items || []));

      nextPath = data.pagination?.nextPageUrl
        ? (data.pagination.nextPageUrl.includes("format=")
            ? data.pagination.nextPageUrl
            : data.pagination.nextPageUrl + "&format=json-pretty")
        : null;
    }

    buildFilters();
    renderCards();
    renderCards();

    statusEl.textContent = "";
  }

  function buildFilters() {
    filtersEl.innerHTML = "";

    const counts = {};
    allPosts.forEach(p =>
      (p.categories || []).forEach(c =>
        counts[c] = (counts[c] || 0) + 1
      )
    );

    Object.keys(counts)
      .sort((a,b) => counts[b] - counts[a] || a.localeCompare(b))
      .forEach(cat => {

        const pill = document.createElement("label");
        pill.className = "filter-pill";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = cat;

        input.addEventListener("change", async () => {
          if (input.checked) {
            activeCategories.add(cat);
            pill.classList.add("active");
          } else {
            activeCategories.delete(cat);
            pill.classList.remove("active");
          }

          gridEl.innerHTML = "";
          visibleCount = 0;

          if (activeCategories.size > 0 && nextPath)
            await loadAllPages();

          renderCards();
          renderCards();
          sendHeight();
        });

        pill.appendChild(input);
        pill.appendChild(document.createTextNode(cat));
        filtersEl.appendChild(pill);
      });
  }

  async function loadAllPages() {
    while (nextPath) {
      const data = await fetchPage(nextPath);
      allPosts.push(...(data.items || []));
      nextPath = data.pagination?.nextPageUrl
        ? (data.pagination.nextPageUrl.includes("format=")
            ? data.pagination.nextPageUrl
            : data.pagination.nextPageUrl + "&format=json-pretty")
        : null;
    }
  }

  function getFiltered() {
    if (activeCategories.size === 0) return allPosts;
    return allPosts.filter(p =>
      p.categories?.some(c => activeCategories.has(c))
    );
  }

  function renderCards() {
    const filtered = getFiltered();
    const slice = filtered.slice(visibleCount, visibleCount + BATCH);

    slice.forEach(post => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = BASE + post.fullUrl;

      a.innerHTML = `
        <div class="card-inner">
          <div class="card-media-wrap">
            <img class="card-img" src="${post.assetUrl}" loading="lazy">
            <div class="card-media-overlay"></div>
          </div>
          <div class="card-text">
            <div class="card-category">${(post.categories || []).join(" · ")}</div>
            <h3 class="card-title">${post.title}</h3>
            <p class="card-excerpt">${(post.excerpt || "").replace(/<[^>]+>/g,"")}</p>
          </div>
        </div>
      `;

      gridEl.appendChild(a);
      observer.observe(a);
    });

    visibleCount += BATCH;
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("visible");
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });

  const sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  gridEl.after(sentinel);

  const scrollObs = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    const filtered = getFiltered();
    if (visibleCount >= filtered.length) return;
    renderCards();
    sendHeight();
  });
  scrollObs.observe(sentinel);

  loadInitial();

})();
</script>

<!-- HEIGHT SYNC FOR SQUARESPACE -->
<script>
function sendHeight(){
  parent.postMessage({ portfolioHeight: document.documentElement.scrollHeight }, "*");
}
new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true});
window.addEventListener("load", sendHeight);
setInterval(sendHeight,300);
</script>

</body>
</html>
