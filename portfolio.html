<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<title>Portfolio</title>

<style>
    body {
      font-family: "Omnes", "Helvetica Neue", Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 40px;
    }

    #portfolio-wrapper {
      max-width: 1300px;
      margin: auto;
    }

    /* --- FILTER --- */
    #filterBar { margin-bottom: 35px; }

    .filter-group label {
      margin-right: 22px;
      cursor: pointer;
      font-size: 15px;
      opacity: .8;
    }

    /* --- GRID --- */
    .portfolio-grid {
      display: grid;
      gap: 45px;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    }

    /* --- CARD --- */
    .card {
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform .28s ease, box-shadow .28s ease;
      transform-origin: center;
    }

    /* Outer zoom */
    .card:hover {
      transform: scale(1.03);
    }

    /* Inner image zoom */
    .card-img-wrapper {
      overflow: hidden;
      border-radius: 7px;
      position: relative;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 7px;
      transition: transform .45s ease;
    }

    .card:hover .card-img {
      transform: scale(1.08);
    }

    .card-category {
      margin-top: 12px;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1.2px;
      opacity: .65;
    }

    .card-title {
      font-size: 23px;
      margin: 6px 0 4px 0;
      font-weight: 600;
    }

    .card-excerpt {
      font-size: 14px;
      opacity: .75;
      line-height: 1.45;
    }

    /* --- LOAD MORE --- */
    #loadMoreBtn {
      margin: 50px auto;
      display: block;
      padding: 12px 25px;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }
</style>

</head>
<body>
<div id="portfolio-wrapper">

  <div id="filterBar">
      <div class="filter-group">
          <label><input type="checkbox" value="Musikvideo"> Musikvideo</label>
          <label><input type="checkbox" value="Personenfotografie"> Personenfotografie</label>
          <label><input type="checkbox" value="Konzertfotografie"> Konzertfotografie</label>
          <label><input type="checkbox" value="Livesession"> Livesession</label>
          <label><input type="checkbox" value="Konzertvideo"> Konzertvideo</label>
          <label><input type="checkbox" value="Real Estate Fotografie"> Real Estate Fotografie</label>
          <label><input type="checkbox" value="Produktfotografie"> Produktfotografie</label>
      </div>
  </div>

  <div class="portfolio-grid" id="portfolioGrid"></div>

  <button id="loadMoreBtn">Mehr laden</button>

</div>

<script>
const proxy = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";
const endpoint = "https://www.flowingframes.media/all-projekte?format=json-pretty";

let allPosts = [];
let page = 1;
let visibleCount = 20;

document.addEventListener("DOMContentLoaded", () => {
  loadAllPages().then(() => {
    renderPosts();
  });

  document.querySelectorAll("#filterBar input").forEach(cb => {
    cb.addEventListener("change", renderPosts);
  });

  document.getElementById("loadMoreBtn").addEventListener("click", () => {
    visibleCount += 20;
    renderPosts();
  });
});

/* -----------------------------
    LOAD ALL PAGES RECURSIVELY
--------------------------------*/
async function loadAllPages() {
  while (true) {
    const res = await fetch(proxy + endpoint + "&page=" + page);
    const text = await res.text();

    if (!text || text.startsWith("<")) break; // Invalid / no more pages

    const json = JSON.parse(text);
    const items = json.items || [];

    if (items.length === 0) break;

    allPosts.push(...items);
    page++;
  }
}

/* -----------------------------
    RENDER POSTS
--------------------------------*/
function renderPosts() {
  const grid = document.getElementById("portfolioGrid");
  grid.innerHTML = "";

  const activeFilters = [...document.querySelectorAll("#filterBar input:checked")]
     .map(cb => cb.value);

  let filtered = allPosts;

  if (activeFilters.length > 0) {
    filtered = filtered.filter(item =>
      item.categories && item.categories.some(c => activeFilters.includes(c))
    );
  }

  filtered.slice(0, visibleCount).forEach(p => {
    grid.appendChild(createCard(p));
  });
}

/* -----------------------------
    CARD BUILDER
--------------------------------*/
function createCard(p) {
  const link = document.createElement("a");

  link.href = p.fullUrl;   // FIXED — richtige URL  
  link.className = "card";

  const img = p.assetUrl || (p.systemData && p.systemData.mainImage && p.systemData.mainImage.assetUrl) || "";

  const excerpt =
      p.excerpt ||
      (p.body && p.body.replace(/<[^>]*>/g, "").split(" ").slice(0, 20).join(" ") + "…") ||
      "";

  link.innerHTML = `
      <div class="card-img-wrapper">
        <img class="card-img" src="${img}">
      </div>
      <div class="card-category">${(p.categories || []).join(", ")}</div>
      <div class="card-title">${p.title || ""}</div>
      <div class="card-excerpt">${excerpt}</div>
  `;
  return link;
}
</script>

</body>
</html>
