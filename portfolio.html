<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* -----------------------------------------------------------
   DESIGN CORE
----------------------------------------------------------- */
:root {
  --bg: #1C1C1C;
  --glass-bg: rgba(28,28,28,0.65);
  --glass-border: rgba(255,255,255,0.08);

  --text-main: #F5F5F5;
  --text-muted: #9B9B9B;

  --border-radius: 14px;
  --pill-radius: 999px;

  --shadow-hover: 0 8px 22px rgba(0,0,0,0.38);
  --shadow-glass: 0 4px 22px rgba(0,0,0,0.45);

  --transition-fast: 0.22s ease-out;
}

/* RESET --------------------------------------------------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 40px 0 120px;
  background: var(--bg);
  font-family: system-ui, Helvetica, Arial, sans-serif;
  color: var(--text-main);
}
a { text-decoration: none; color: inherit; }

/* -----------------------------------------------------------
   DESKTOP WRAPPER — unverändert
----------------------------------------------------------- */
#portfolio-wrapper {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 0 48px;
}

/* -----------------------------------------------------------
   FILTER BAR DESKTOP — unverändert
----------------------------------------------------------- */
#filterBar {
  margin-bottom: 32px;
  position: relative;
  padding: 14px 0;
  z-index: 2;
}

.filter-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
  position: relative;
}

.filter-group-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--text-muted);
  margin-bottom: 10px;
  pointer-events: none;
}

#categoryFilters {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.filter-pill {
  display: inline-flex;
  justify-content: center;
  align-items: center;

  padding: 9px 24px;
  border-radius: var(--pill-radius);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);

  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-muted);

  transition: var(--transition-fast);
  cursor: pointer;
  white-space: nowrap;
}

.filter-pill:hover {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.25);
}

.filter-pill.active {
  background: rgba(255,255,255,0.18);
  border-color: rgba(255,255,255,0.5);
  color: white;
}

.filter-pill input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* Fade edges (desktop hidden) */
.filter-scroll-indicator {
  display: none;
}

/* -----------------------------------------------------------
   GRID DESKTOP — unverändert (3 Spalten)
----------------------------------------------------------- */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 34px;
}

/* -----------------------------------------------------------
   MOBILE VERSION — *NUR GRID AUS DEINER WUNSCHVERSION*
----------------------------------------------------------- */
@media (max-width: 768px) {

  /* GRID exakt wie deine mobile Wunschversion */
  .portfolio-grid {
    grid-template-columns: 1fr !important;
    gap: 22px !important;
  }

  #portfolio-wrapper {
    padding: 0 16px !important;
  }

  .card-text {
    padding: 14px !important;
  }

  .card-category {
    font-size: 10px !important;
    margin-bottom: 4px !important;
  }

  .card-title {
    font-size: 17px !important;
    margin-bottom: 4px !important;
  }

  .card-excerpt {
    font-size: 12px !important;
  }
}
</style>
</head>

<body>

<!-- FILTERBAR ÜBER DEM WRAPPER — unverändert -->
<div id="filterBar">
  <div class="filter-inner">
    <div class="filter-group">
      <div class="filter-group-label">Kategorien</div>
      <div id="categoryFilters"></div>
    </div>
    <div class="filter-scroll-indicator filter-scroll-indicator--left"></div>
    <div class="filter-scroll-indicator filter-scroll-indicator--right"></div>
  </div>
</div>

<div id="portfolio-wrapper">
  <div id="portfolioGrid" class="portfolio-grid"></div>
  <div id="statusMessage"></div>
</div>

<script>
/* ENGINE unverändert */
(function() {

  const BASE  = "https://www.flowingframes.media";
  const PROXY = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";

  let allPosts = [];
  let nextPath = "/all-projekte?format=json-pretty";
  let activeCategories = new Set();

  const gridEl        = document.getElementById("portfolioGrid");
  const filtersEl     = document.getElementById("categoryFilters");
  const statusEl      = document.getElementById("statusMessage");
  const indicatorLeft  = document.querySelector(".filter-scroll-indicator--left");
  const indicatorRight = document.querySelector(".filter-scroll-indicator--right");

  let visibleCount = 0;
  const BATCH = 30;

  async function fetchPage(path) {
    const res = await fetch(PROXY + encodeURIComponent(BASE + path));
    return res.json();
  }

  async function loadInitial() {
    statusEl.textContent = "Lade Projekte …";

    while (nextPath && allPosts.length < 100) {
      const data = await fetchPage(nextPath);
      allPosts.push(...(data.items || []));
      nextPath = data.pagination?.nextPageUrl
        ? (data.pagination.nextPageUrl.includes("format=")
            ? data.pagination.nextPageUrl
            : data.pagination.nextPageUrl + "&format=json-pretty")
        : null;
    }

    buildFilters();
    renderCards();
    renderCards();
    statusEl.textContent = "";
    updateScrollIndicators();
  }

  function buildFilters() {
    filtersEl.innerHTML = "";

    const counts = {};
    allPosts.forEach(p => (p.categories || []).forEach(c => counts[c] = (counts[c] || 0) + 1));

    Object.keys(counts)
      .sort((a,b) => counts[b]-counts[a] || a.localeCompare(b))
      .forEach(cat => {
        const pill = document.createElement("label");
        pill.className = "filter-pill";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = cat;

        input.addEventListener("change", async () => {
          if (input.checked) { activeCategories.add(cat); pill.classList.add("active"); }
          else { activeCategories.delete(cat); pill.classList.remove("active"); }

          gridEl.innerHTML = "";
          visibleCount = 0;

          if (activeCategories.size > 0 && nextPath) await loadAllPages();

          renderCards();
          renderCards();
          sendHeight();
        });

        pill.appendChild(input);
        pill.appendChild(document.createTextNode(cat));
        filtersEl.appendChild(pill);
      });

    updateScrollIndicators();
  }

  async function loadAllPages() {
    while (nextPath) {
      const data = await fetchPage(nextPath);
      allPosts.push(...(data.items || []));
      nextPath = data.pagination?.nextPageUrl
        ? (data.pagination.nextPageUrl.includes("format=")
            ? data.pagination.nextPageUrl
            : data.pagination.nextPageUrl + "&format=json-pretty")
        : null;
    }
  }

  function getFiltered() {
    return activeCategories.size === 0
      ? allPosts
      : allPosts.filter(p => p.categories?.some(c => activeCategories.has(c)));
  }

  function renderCards() {
    const slice = getFiltered().slice(visibleCount, visibleCount + BATCH);

    slice.forEach(post => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = BASE + post.fullUrl;

      a.innerHTML = `
        <div class="card-inner">
          <div class="card-media-wrap">
            <img class="card-img" src="${post.assetUrl}" loading="lazy" alt="">
            <div class="card-media-overlay"></div>
          </div>
          <div class="card-text">
            <div class="card-category">${(post.categories || []).join(" · ")}</div>
            <h3 class="card-title">${post.title}</h3>
            <p class="card-excerpt">${(post.excerpt || "").replace(/<[^>]+>/g,"")}</p>
          </div>
        </div>
      `;
      gridEl.appendChild(a);
      observer.observe(a);
    });

    visibleCount += BATCH;
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("visible");
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });

  const sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  gridEl.after(sentinel);

  const scrollObs = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    const filtered = getFiltered();
    if (visibleCount >= filtered.length) return;
    renderCards();
    sendHeight();
  });
  scrollObs.observe(sentinel);

  // Fade-Logik
  function updateScrollIndicators() {
    const maxScroll = filtersEl.scrollWidth - filtersEl.clientWidth;
    if (maxScroll <= 0) {
      indicatorLeft.classList.remove("visible");
      indicatorRight.classList.remove("visible");
      return;
    }

    const sl = filtersEl.scrollLeft;
    indicatorLeft.classList.toggle("visible", sl > 2);
    indicatorRight.classList.toggle("visible", sl < maxScroll - 2);
  }

  filtersEl.addEventListener("scroll", updateScrollIndicators);
  window.addEventListener("resize", () => setTimeout(updateScrollIndicators, 80));

  loadInitial();

})();
</script>

<!-- HEIGHT SYNC -->
<script>
function sendHeight(){
  parent.postMessage({ portfolioHeight: document.documentElement.scrollHeight }, "*");
}
new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true});
window.addEventListener("load", sendHeight);
setInterval(sendHeight,300);
</script>

</body>
</html>
