<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- ADOBE FONTS (Neu hinzugefügt) -->
<link rel="stylesheet" href="https://use.typekit.net/cke2yrp.css">

<style>
/* -----------------------------------------------------------
   DESIGN CORE
----------------------------------------------------------- */
:root {
  --bg: #1C1C1C;
  --glass-bg: rgba(28,28,28,0.65);
  --glass-border: rgba(255,255,255,0.08);

  --text-main: #F5F5F5;
  --text-muted: #9B9B9B;

  --border-radius: 14px;
  --pill-radius: 999px;

  --shadow-hover: 0 8px 22px rgba(0,0,0,0.38);
  --shadow-glass: 0 4px 22px rgba(0,0,0,0.45);

  --transition-fast: 0.22s ease-out;
}

/* RESET --------------------------------------------------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 40px 0 120px;
  background: var(--bg);

  /* Omnes Pro global */
  font-family: "omnes-pro", system-ui, Helvetica, Arial, sans-serif;
  color: var(--text-main);
}

a { text-decoration: none; color: inherit; }

/* WRAPPER ------------------------------------------------- */
#portfolio-wrapper {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 0 48px;
}

/* -----------------------------------------------------------
   FILTER BAR – DESKTOP
----------------------------------------------------------- */
#filterBar {
  margin-bottom: 32px;
  position: relative;
  padding: 30px 0;
  z-index: 2;
}

.filter-inner-desktop {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
  position: relative;
}

/* Desktop Linien */
@media (min-width: 769px) {
  .filter-inner-desktop {
    padding: 20px 16px;
  }

  .filter-inner-desktop::before,
  .filter-inner-desktop::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }
  .filter-inner-desktop::before { top: 0; }
  .filter-inner-desktop::after { bottom: 0; }
}

/* Kategorien Label Desktop */
.filter-group-label {
  font-family: "omnes-pro", sans-serif;
  font-size: 13px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: .28em;
  color: #D3D3D3;
  margin-top: 14px;
  margin-bottom: 34px;
  text-align: center;
}

/* Desktop: Pills flexibel */
@media (min-width: 769px) {
  #categoryFilters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
}

.filter-pill {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  padding: 9px 24px;
  border-radius: var(--pill-radius);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
  transition: var(--transition-fast);
  position: relative;
  font-family: "omnes-pro", sans-serif;
}

/* Invisible input */
.filter-pill input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* Active */
.filter-pill.active {
  background: rgba(255,255,255,0.18);
  border-color: rgba(255,255,255,0.5);
  color: white;
}

/* PREMIUM HOVER – Desktop */
@media (min-width: 769px) {
  .filter-pill:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-1px);
  }
}

/* -----------------------------------------------------------
   DESKTOP GRID
----------------------------------------------------------- */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 34px;
}

.card {
  display: block;
  background: #1B1B1B;
  border-radius: var(--border-radius);
  overflow: hidden;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .65s ease, transform .65s ease, box-shadow .30s ease;
}
.card.visible { opacity: 1; transform: translateY(0); }

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.30);
}

.card-img {
  transition: transform 0.4s ease, filter 0.4s ease;
}
.card:hover .card-img {
  transform: scale(1.03);
  filter: brightness(0.80);
}

.card-media-wrap { position: relative; overflow: hidden; }
.card-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
}

/* -----------------------------------------------------------
   TEXT (Kategorie, Titel, Exzerpt) — NOW USING OMNES PRO
----------------------------------------------------------- */
.card-text {
  padding: 6px 0;
}

/* Kategorie */
.card-category {
  font-family: "omnes-pro", sans-serif;
  font-size: 13px;
  margin-bottom: 0px;
  line-height: 1.0;
  text-transform: uppercase;
  color: var(--text-muted);
  -webkit-font-smoothing: antialiased;
}

/* Titel */
.card-title {
  font-family: "omnes-pro", sans-serif;
  font-size: 15px; /* 14.92px */
  margin-bottom: 8px;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

/* Exzerpt */
.card-excerpt {
  font-family: "omnes-pro", sans-serif;
  font-size: 14px;
  color: var(--text-muted);
  -webkit-font-smoothing: antialiased;
}

/* -----------------------------------------------------------
   MOBILE
----------------------------------------------------------- */
@media (max-width: 768px) {

  body { padding-bottom: 160px; }

  #mobileLabel {
    display: block;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: #D3D3D3;
    margin: 6px 0 12px 0;
    font-family: "omnes-pro", sans-serif;
  }

  .filter-group-label { display: none; }

  #filterBar {
    margin-bottom: 20px;
    padding: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(18px) saturate(180%);
    border-top: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: var(--shadow-glass);
  }

  .filter-inner-desktop { padding: 0; margin: 0; }

  #categoryFilters {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    gap: 14px;
    padding: 12px 18px;
    scrollbar-width: none;
  }
  #categoryFilters::-webkit-scrollbar { display: none; }

  .filter-pill {
    padding: 10px 24px;
    font-size: 12px;
    flex-shrink: 0;
  }

  /* Fade (mobile) */
  #filterBar::before,
  #filterBar::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 42px;
    pointer-events: none;
    z-index: 50;
  }

  #filterBar::before {
    left: 0;
    background: linear-gradient(to right, rgba(28,28,28,0.85), rgba(28,28,28,0));
  }

  #filterBar::after {
    right: 0;
    background: linear-gradient(to left, rgba(28,28,28,0.85), rgba(28,28,28,0));
  }

  .card-text { padding: 6px 0; }
  .card-category { margin-bottom: 0px; font-size: 10px; line-height:1.0; }
  .card-title { font-size: 16px; margin-bottom: 8px; }
  .card-excerpt { font-size: 12px; line-height: 1.35; }

  .portfolio-grid {
    grid-template-columns: 1fr;
    gap: 22px;
  }
}

/* Mobile label hidden on Desktop */
@media (min-width: 769px) {
  #mobileLabel { display: none; }
}
</style>
</head>

<body>

<div id="mobileLabel">Kategorien</div>

<div id="filterBar">
  <div class="filter-inner-desktop">
    <div class="filter-group">
      <div class="filter-group-label">Kategorien</div>
      <div id="categoryFilters"></div>
    </div>
  </div>
</div>

<div id="portfolio-wrapper">
  <div id="portfolioGrid" class="portfolio-grid"></div>
  <div id="statusMessage"></div>
</div>

<script>
/* ================== PORTFOLIO ENGINE ================== */
(function() {

  const BASE  = "https://www.flowingframes.media";
  const PROXY = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";

  let allPosts = [];
  let nextPath = "/all-projekte?format=json-pretty";
  let activeCategories = new Set();

  const gridEl        = document.getElementById("portfolioGrid");
  const filtersEl     = document.getElementById("categoryFilters");
  const statusEl      = document.getElementById("statusMessage");

  let visibleCount = 0;
  const BATCH = 30;

  async function fetchPage(path) {
    const res = await fetch(PROXY + encodeURIComponent(BASE + path));
    return res.json();
  }

  async function loadInitial() {
    statusEl.textContent = "Lade Projekte …";

    while (nextPath && allPosts.length < 100) {
      const data = await fetchPage(nextPath);
      allPosts.push(...(data.items || []));
      if (data.pagination?.nextPageUrl) {
        const u = data.pagination.nextPageUrl;
        nextPath = u.includes("format=") ? u : u + "&format=json-pretty";
      } else nextPath = null;
    }

    buildFilters();
    renderCards();
    renderCards();

    statusEl.textContent = "";
  }

  function buildFilters() {
    filtersEl.innerHTML = "";
    const counts = {};

    allPosts.forEach(p =>
      (p.categories || []).forEach(c =>
        counts[c] = (counts[c] || 0) + 1
      )
    );

    Object.keys(counts)
      .sort((a,b) => counts[b]-counts[a] || a.localeCompare(b))
      .forEach(cat => {
        const pill = document.createElement("label");
        pill.className = "filter-pill";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = cat;

        input.addEventListener("change", async () => {
          if (input.checked) activeCategories.add(cat);
          else activeCategories.delete(cat);

          pill.classList.toggle("active", input.checked);

          gridEl.innerHTML = "";
          visibleCount = 0;

          if (activeCategories.size > 0 && nextPath)
            await loadAllPages();

          renderCards();
          renderCards();
          sendHeight();
        });

        pill.appendChild(input);
        pill.appendChild(document.createTextNode(cat));
        filtersEl.appendChild(pill);
      });
  }

  async function loadAllPages() {
    while (nextPath) {
      const data = await fetchPage(nextPath);
      allPosts.push(...(data.items || []));
      if (data.pagination?.nextPageUrl) {
        const u = data.pagination.nextPageUrl;
        nextPath = u.includes("format=") ? u : u + "&format=json-pretty";
      } else nextPath = null;
    }
  }

  function getFiltered() {
    if (activeCategories.size === 0) return allPosts;
    return allPosts.filter(p =>
      p.categories?.some(c => activeCategories.has(c))
    );
  }

  function renderCards() {
    const filtered = getFiltered();
    const slice = filtered.slice(visibleCount, visibleCount+BATCH);

    slice.forEach(post => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = BASE + post.fullUrl;

      a.innerHTML = `
        <div class="card-inner">
          <div class="card-media-wrap">
            <img class="card-img" src="${post.assetUrl}" loading="lazy">
            <div class="card-media-overlay"></div>
          </div>
          <div class="card-text">
            <div class="card-category">${(post.categories||[]).join(" · ")}</div>
            <h3 class="card-title">${post.title}</h3>
            <p class="card-excerpt">${(post.excerpt||"").replace(/<[^>]+>/g,"")}</p>
          </div>
        </div>
      `;

      gridEl.appendChild(a);
      observer.observe(a);
    });

    visibleCount += BATCH;
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("visible");
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });

  const sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  gridEl.after(sentinel);

  const scrollObs = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    const filtered = getFiltered();
    if (visibleCount >= filtered.length) return;
    renderCards();
    sendHeight();
  });
  scrollObs.observe(sentinel);

  loadInitial();

})();

</script>

<script>
function sendHeight(){
  parent.postMessage({ portfolioHeight: document.documentElement.scrollHeight }, "*");
}
new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true});
window.addEventListener("load", sendHeight);
setInterval(sendHeight,300);
</script>

</body>
</html>
