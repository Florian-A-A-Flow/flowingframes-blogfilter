<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>

<style>
/* ----------------------------------------
   GLOBAL STYLE (Squarespace-like)
---------------------------------------- */
body {
  margin: 0;
  padding: 40px;
  background: #111;
  color: white;
  font-family: var(--font-primary);   /* ← Omnes Pro */
}

/* Wrapper */
#portfolio-wrapper {
  max-width: 1300px;
  margin: auto;
}

/* Filter */
#filterBar {
  margin-bottom: 35px;
}

.filter-group label {
  font-weight: 600;
  margin-right: 25px;
  cursor: pointer;
  font-size: 15px;
  opacity: 0.85;
}

.filter-group input {
  margin-right: 6px;
}

/* Grid */
.portfolio-grid {
  display: grid;
  gap: 50px;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
}

/* Card */
.card {
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: all 0.3s ease;
}

.card:hover .card-img {
  transform: scale(1.03);
  opacity: 0.85;
}

.card-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: 8px;
  transition: all 0.3s;
}

.card-category {
  margin-top: 14px;
  text-transform: uppercase;
  font-size: 12px;
  opacity: 0.6;
  letter-spacing: 1px;
}

.card-title {
  margin: 6px 0;
  font-size: 22px;
  font-weight: 600;
}

.card-date {
  opacity: 0.6;
  font-size: 13px;
}

/* Load more */
#loadMoreBtn {
  margin: 50px auto;
  display: block;
  padding: 14px 26px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  background: white;
  color: black;
  transition: 0.25s;
}

#loadMoreBtn:hover {
  background: #ddd;
}
</style>
</head>
<body>

<div id="portfolio-wrapper">

  <!-- FILTER -->
  <div id="filterBar">
    <div class="filter-group" id="categoryFilters">
      <label><input type="checkbox" value="Musikvideo"> Musikvideo</label>
      <label><input type="checkbox" value="Personenfotografie"> Personenfotografie</label>
      <label><input type="checkbox" value="Konzertfotografie"> Konzertfotografie</label>
      <label><input type="checkbox" value="Livesession"> Livesession</label>
      <label><input type="checkbox" value="Konzertvideo"> Konzertvideo</label>
      <label><input type="checkbox" value="Real Estate Fotografie"> Real Estate Fotografie</label>
      <label><input type="checkbox" value="Produktfotografie"> Produktfotografie</label>
    </div>
  </div>

  <!-- GRID -->
  <div class="portfolio-grid" id="portfolioGrid"></div>

  <!-- LOAD MORE -->
  <button id="loadMoreBtn">Mehr laden</button>

</div>


<script>
/* ----------------------------------------
   CONFIG
---------------------------------------- */
const PROXY = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";
const FEED = "https://www.flowingframes.media/all-projekte?format=json-pretty";

let allPosts = [];
let visible = 0;
const CHUNK = 12;

/* ----------------------------------------
   LOAD POSTS
---------------------------------------- */
async function loadPosts() {
  try {
    const res = await fetch(PROXY + FEED);
    const text = await res.text();

    // Check if valid JSON
    if (!text.startsWith("{")) {
      console.error("Invalid JSON from proxy:", text);
      return;
    }

    const json = JSON.parse(text);

    allPosts = json.items || [];
    visible = 0;

    renderPosts();

  } catch (err) {
    console.error("Fetch error:", err);
  }
}

/* ----------------------------------------
   RENDER
---------------------------------------- */
function renderPosts() {
  const grid = document.getElementById("portfolioGrid");
  grid.innerHTML = "";

  const selectedCats = [...document.querySelectorAll("#categoryFilters input:checked")]
    .map(c => c.value);

  let posts = allPosts;

  if (selectedCats.length > 0) {
    posts = posts.filter(p =>
      p.categories &&
      p.categories.some(cat => selectedCats.includes(cat))
    );
  }

  const slice = posts.slice(0, visible + CHUNK);
  visible += CHUNK;

  slice.forEach(p => {
    const date = p.publishOn ? p.publishOn.date : "";
    const img = p.assetUrl || p.assetUrlAbsolute || "";
    const cat = p.categories ? p.categories.join(", ") : "";

    grid.innerHTML += `
      <a class="card" href="${p.fullUrl}">
        <img class="card-img" src="${img}">
        <div class="card-category">${cat}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-date">${date}</div>
      </a>
    `;
  });
}

/* ----------------------------------------
   EVENTS
---------------------------------------- */
document.getElementById("loadMoreBtn").addEventListener("click", renderPosts);
document.querySelectorAll("#categoryFilters input").forEach(cb =>
  cb.addEventListener("change", renderPosts)
);

/* Init */
loadPosts();

</script>

</body>
</html>
