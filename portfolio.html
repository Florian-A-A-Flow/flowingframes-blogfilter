<style>
  .sqs-block {
    padding: 0 !important;
  }

  #portfolio-container {
    width: 100%;
    margin: 0;
    padding: 0;
    position: relative;
  }

  #portfolio-iframe {
    width: 100%;
    border: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity .35s ease, height .4s ease;
  }
</style>

<div id="portfolio-container">
  <iframe
    id="portfolio-iframe"
    src="https://florian-a-a-flow.github.io/flowingframes-blogfilter/portfolio.html"
    scrolling="no"
  ></iframe>
</div>

<script>
(function() {
  const iframe = document.getElementById("portfolio-iframe");
  let first = true;

  window.addEventListener("message", (event) => {
    if (!event.data?.portfolioHeight) return;

    const h = event.data.portfolioHeight;
    iframe.style.height = h + "px";

    if (first) {
      iframe.style.opacity = 1;
      first = false;
    }
  });
})();
</script>
