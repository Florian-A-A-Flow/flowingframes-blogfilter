<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #1B1B1B;          /* Seiten-Hintergrund */
      --card-bg: #1B1B1B;     /* Karten-/Textbox-Hintergrund */
      --text-main: #f5f5f5;
      --text-muted: #a0a0a0;
      --accent: #ffffff;
      --border-radius: 10px;
      --transition-fast: 0.22s ease-out;
      --shadow-soft: 0 18px 55px rgba(0, 0, 0, 0.6);
      /* V1.5: dezenter, „härterer“ Hover-Schatten */
      --shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0 60px;
      background: var(--bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #portfolio-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Filter Bar */
    #filterBar {
      margin-bottom: 32px;
    }

    .filter-group-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Sortierteres Layout: Grid statt „chaotischem“ Flex */
    #categoryFilters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, auto));
      column-gap: 14px;
      row-gap: 10px;
      align-items: stretch;
    }

    .filter-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      cursor: pointer;
      transition: background var(--transition-fast),
                  border-color var(--transition-fast),
                  color var(--transition-fast),
                  transform var(--transition-fast);
      text-align: center;
      white-space: nowrap;
    }

    /* Checkbox unsichtbar – nur Pill sichtbar */
    .filter-pill input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .filter-pill:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .filter-pill.active {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.7);
      color: #ffffff;
    }

    /* Grid */
    .portfolio-grid {
      display: grid;
      gap: 34px;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }

    /* Card */
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      /* Kein Schatten im Idle-Zustand */
      box-shadow: none;
      transform: translate3d(0, 0, 0);
      transition:
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        background var(--transition-fast);
    }

    .card-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card-media-wrap {
      position: relative;
      overflow: hidden;
      border-radius: var(--border-radius);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1),
                  filter 0.45s cubic-bezier(0.19, 1, 0.22, 1);
      transform-origin: center;
    }

    .card-media-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 0, rgba(0,0,0,0.4) 80%);
      opacity: 0;
      transition: opacity 0.45s ease-out;
      pointer-events: none;
    }

    .card-text {
      padding: 18px 18px 20px;
      background: var(--card-bg);
    }

    .card-category {
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 20px;
      line-height: 1.2;
      font-weight: 600;
      margin: 0 0 6px;
      color: var(--text-main);
    }

    .card-excerpt {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-muted);
      margin: 0;
    }

    /* Hover Effekt – Tiefe, Zoom, Schatten */
    .card:hover {
      transform: translate3d(0, -6px, 0) scale(1.015);
      box-shadow: var(--shadow-hover);
      background: #202020;
    }

    .card:hover .card-img {
      transform: scale(1.06);
      filter: saturate(1.05) contrast(1.02);
    }

    .card:hover .card-media-overlay {
      opacity: 1;
    }

    /* Load More Button */
    #loadMoreBtn {
      margin: 40px auto 0;
      display: none;
      background: #ffffff;
      color: #000000;
      padding: 14px 28px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition:
        background var(--transition-fast),
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        color var(--transition-fast);
    }

    #loadMoreBtn:hover {
      transform: translateY(-2px);
      background: #f5f5f5;
      box-shadow: 0 16px 45px rgba(0,0,0,0.85);
    }

    #loadMoreBtn:active {
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    /* Info / Fehler */
    #statusMessage {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg);
    }

    @media (max-width: 768px) {
      body {
        padding: 24px 0 40px;
      }

      #portfolio-wrapper {
        padding: 0 12px;
      }

      .portfolio-grid {
        gap: 26px;
        grid-template-columns: 1fr;
      }

      .card-text {
        padding: 16px 14px 18px;
      }

      .card-title {
        font-size: 18px;
      }

      #categoryFilters {
        grid-template-columns: repeat(auto-fit, minmax(120px, auto));
      }
    }
  </style>
</head>
<body>
  <div id="portfolio-wrapper">
    <!-- Filter -->
    <div id="filterBar">
      <div class="filter-group">
        <div class="filter-group-label">Kategorien</div>
        <div id="categoryFilters"></div>
      </div>
    </div>

    <!-- Grid -->
    <div id="portfolioGrid" class="portfolio-grid"></div>

    <!-- Load More -->
    <button id="loadMoreBtn" class="load-more">Mehr laden</button>

    <div id="statusMessage"></div>
  </div>

  <script>
    (function () {
      const BASE = "https://www.flowingframes.media";
      const PROXY =
        "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";

      let allPosts = [];
      let visibleCount = 50;
      let nextPath = "/all-projekte?format=json-pretty";
      let activeCategories = new Set();

      const gridEl = document.getElementById("portfolioGrid");
      const filtersEl = document.getElementById("categoryFilters");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const statusEl = document.getElementById("statusMessage");

      async function fetchPage(path) {
        const url = PROXY + encodeURIComponent(BASE + path);
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error("Fehler beim Laden: " + res.status);
        }
        return res.json();
      }

      function getExcerptText(post) {
        if (!post.excerpt) return "";
        return post.excerpt.replace(/<[^>]+>/g, "").trim();
      }

      function getCategoryLabel(post) {
        if (Array.isArray(post.categories) && post.categories.length > 0) {
          return post.categories.join(" · ");
        }
        return "";
      }

      function buildFilters() {
        filtersEl.innerHTML = "";

        // Kategorien + Häufigkeit zählen
        const counts = {};
        allPosts.forEach((p) => {
          (p.categories || []).forEach((c) => {
            counts[c] = (counts[c] || 0) + 1;
          });
        });

        const sorted = Object.keys(counts).sort((a, b) => {
          // Erst nach Anzahl (desc), dann alphabetisch
          if (counts[b] !== counts[a]) {
            return counts[b] - counts[a];
          }
          return a.localeCompare(b, "de", { sensitivity: "base" });
        });

        sorted.forEach((cat) => {
          const label = document.createElement("label");
          label.className = "filter-pill";

          const input = document.createElement("input");
          input.type = "checkbox";
          input.value = cat;

          input.addEventListener("change", () => {
            if (input.checked) {
              activeCategories.add(cat);
              label.classList.add("active");
            } else {
              activeCategories.delete(cat);
              label.classList.remove("active");
            }
            renderPosts();
          });

          const text = document.createElement("span");
          text.textContent = cat;

          label.appendChild(input);
          label.appendChild(text);
          filtersEl.appendChild(label);
        });
      }

      function getFilteredPosts() {
        if (activeCategories.size === 0) {
          return allPosts;
        }
        return allPosts.filter((p) => {
          if (!Array.isArray(p.categories)) return false;
          return p.categories.some((c) => activeCategories.has(c));
        });
      }

      function renderPosts() {
        const filtered = getFilteredPosts();
        const toShow = filtered.slice(0, visibleCount);

        gridEl.innerHTML = "";

        toShow.forEach((p) => {
          const href = BASE + p.fullUrl;

          const a = document.createElement("a");
          a.className = "card";
          a.href = href;
          a.target = "_top"; // raus aus dem Embed
          a.rel = "noopener";

          const inner = document.createElement("div");
          inner.className = "card-inner";

          const mediaWrap = document.createElement("div");
          mediaWrap.className = "card-media-wrap";

          const img = document.createElement("img");
          img.className = "card-img";
          img.src = p.assetUrl;
          img.alt = p.title || "";
          img.loading = "lazy";

          const overlay = document.createElement("div");
          overlay.className = "card-media-overlay";

          mediaWrap.appendChild(img);
          mediaWrap.appendChild(overlay);

          const text = document.createElement("div");
          text.className = "card-text";

          const catEl = document.createElement("div");
          catEl.className = "card-category";
          catEl.textContent = getCategoryLabel(p);

          const titleEl = document.createElement("h3");
          titleEl.className = "card-title";
          titleEl.textContent = p.title || "";

          const excerptEl = document.createElement("p");
          excerptEl.className = "card-excerpt";
          excerptEl.textContent = getExcerptText(p);

          text.appendChild(catEl);
          text.appendChild(titleEl);
          if (excerptEl.textContent) {
            text.appendChild(excerptEl);
          }

          inner.appendChild(mediaWrap);
          inner.appendChild(text);
          a.appendChild(inner);
          gridEl.appendChild(a);
        });

        const hasMoreInFiltered = filtered.length > visibleCount;
        const canLoadMoreFromServer = !!nextPath;

        if (hasMoreInFiltered || canLoadMoreFromServer) {
          loadMoreBtn.style.display = "block";
        } else {
          loadMoreBtn.style.display = "none";
        }

        statusEl.textContent =
          filtered.length === 0
            ? "Keine Projekte für die gewählten Kategorien."
            : "";
      }

      async function loadInitial() {
        try {
          statusEl.textContent = "Lade Projekte ...";

          // Lade Seiten, bis wir mindestens 50 haben oder keine weiteren Seiten
          while (nextPath && allPosts.length < 50) {
            const data = await fetchPage(nextPath);
            allPosts = allPosts.concat(data.items || []);

            if (data.pagination && data.pagination.nextPage) {
              let np = data.pagination.nextPageUrl;
              if (!np.includes("format=")) {
                np += (np.includes("?") ? "&" : "?") + "format=json-pretty";
              }
              nextPath = np;
            } else {
              nextPath = null;
            }
          }

          buildFilters();
          renderPosts();
          statusEl.textContent = "";
        } catch (err) {
          console.error(err);
          statusEl.textContent =
            "Beim Laden der Projekte ist ein Fehler aufgetreten.";
        }
      }

      async function handleLoadMore() {
        const filteredBefore = getFilteredPosts();
        const hadAllVisible = visibleCount >= filteredBefore.length;

        if (hadAllVisible && nextPath) {
          try {
            const data = await fetchPage(nextPath);
            allPosts = allPosts.concat(data.items || []);

            if (data.pagination && data.pagination.nextPage) {
              let np = data.pagination.nextPageUrl;
              if (!np.includes("format=")) {
                np += (np.includes("?") ? "&" : "?") + "format=json-pretty";
              }
              nextPath = np;
            } else {
              nextPath = null;
            }
          } catch (err) {
            console.error(err);
          }
        }

        visibleCount += 50;
        renderPosts();
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadMoreBtn.addEventListener("click", handleLoadMore);
        loadInitial();
      });
    })();
  </script>

  <script>
function sendHeight() {
  const height = document.documentElement.scrollHeight;
  parent.postMessage({ portfolioHeight: height }, "*");
}

// initial
sendHeight();

// if content changes dynamically
setInterval(sendHeight, 300);
</script>

</body>
</html>
