<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg: #1B1B1B;
  --card-bg: #1B1B1B;
  --text-main: #f5f5f5;
  --text-muted: #a0a0a0;
  --border-radius: 10px;
  --shadow-hover: 0 6px 16px rgba(0,0,0,0.3);
}

/* RESET */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 40px 0 120px; /* Platz für Bottom-Bar */
  background: var(--bg);
  color: var(--text-main);
  font-family: system-ui, Helvetica, Arial, sans-serif;
}

/* WRAPPER */
#portfolio-wrapper {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ============================================================
   FILTER BAR — DESKTOP (oben, normal)
   ============================================================ */
#filterBar {
  margin-bottom: 32px;
  position: relative;
}

.filter-group-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

/* Desktop Grid */
#categoryFilters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, auto));
  gap: 12px;
}

.filter-pill {
  display: inline-flex;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--text-muted);
  cursor: pointer;
  transition: .25s;
  white-space: nowrap;
}

.filter-pill input { opacity: 0; position: absolute; pointer-events: none; }
.filter-pill:hover { border-color: rgba(255,255,255,0.35); }
.filter-pill.active {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.8);
  color:white;
}

/* ============================================================
   GRID + CARDS
   ============================================================ */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px,1fr));
  gap: 34px;
}

.card {
  display: block;
  color: inherit;
  background: var(--card-bg);
  border-radius: var(--border-radius);
  overflow: hidden;
  transform: translateY(20px);
  opacity: 0;
  transition: opacity .6s ease, transform .6s ease, box-shadow .35s ease;
}
.card.visible {
  opacity: 1;
  transform: translateY(0);
}
.card:hover {
  box-shadow: var(--shadow-hover);
}

.card-media-wrap { position: relative; border-radius: var(--border-radius); overflow: hidden; }
.card-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  transition: transform .45s ease;
}
.card:hover .card-img { transform: scale(1.06); }

.card-media-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.35) 80%);
  opacity: 0;
  transition: opacity .45s ease;
}
.card:hover .card-media-overlay { opacity: 1; }

.card-text { padding: 18px; }
.card-category { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
.card-title { font-size: 20px; margin: 0 0 6px; }
.card-excerpt { font-size: 13px; color: var(--text-muted); margin: 0; }

/* STATUS */
#statusMessage {
  margin-top: 24px;
  text-align: center;
  color: var(--text-muted);
}

/* ============================================================
   MOBILE — Floating Bottom-Bar (Vollbreit, Swipe-Leiste)
   ============================================================ */
@media (max-width: 768px) {

  body {
    padding-bottom: 130px; /* mehr Platz für Bar */
  }

  /* Bottom Bar — Vollbreit wie Sticky Header (aber unten) */
  #filterBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    padding: 14px 12px;
    background: rgba(27,27,27,0.92);
    backdrop-filter: blur(12px);

    border-top: 1px solid rgba(255,255,255,0.08);
    z-index: 60;
  }

  /* keine Überschrift – spart Platz */
  .filter-group-label {
    display: none;
  }

  /* Horizontale Swipe-Leiste */
  #categoryFilters {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  #categoryFilters::-webkit-scrollbar { display: none; }

  .filter-pill {
    padding: 7px 18px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div id="portfolio-wrapper">

  <!-- FILTERBAR -->
  <div id="filterBar">
    <div class="filter-group">
      <div class="filter-group-label">Kategorien</div>
      <div id="categoryFilters"></div>
    </div>
  </div>

  <!-- GRID -->
  <div id="portfolioGrid" class="portfolio-grid"></div>
  <div id="statusMessage"></div>
</div>

<script>
(function() {

  const BASE  = "https://www.flowingframes.media";
  const PROXY = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";

  let allPosts = [];
  let nextPath = "/all-projekte?format=json-pretty";
  let activeCategories = new Set();

  const gridEl    = document.getElementById("portfolioGrid");
  const filtersEl = document.getElementById("categoryFilters");
  const statusEl  = document.getElementById("statusMessage");

  let visibleCount = 0;
  const BATCH = 30;

  async function fetchPage(path) {
    const url = PROXY + encodeURIComponent(BASE + path);
    const res = await fetch(url);
    return res.json();
  }

  /* ---------------- LOAD INITIAL ---------------- */
  async function loadInitial() {
    statusEl.textContent = "Lade Projekte …";

    while (nextPath && allPosts.length < 100) {
      const data = await fetchPage(nextPath);
      allPosts.push(...(data.items || []));

      if (data.pagination?.nextPageUrl) {
        const u = data.pagination.nextPageUrl;
        nextPath = u.includes("format=") ? u : u + "&format=json-pretty";
      } else nextPath = null;
    }

    buildFilters();
    renderCards();
    renderCards();

    statusEl.textContent = "";
  }

  /* ---------------- FILTER SYSTEM ---------------- */
  function buildFilters() {
    filtersEl.innerHTML = "";

    const counts = {};
    allPosts.forEach(post =>
      (post.categories || []).forEach(cat =>
        counts[cat] = (counts[cat] || 0) + 1
      )
    );

    Object.keys(counts)
      .sort()
      .forEach(cat => {

        const pill = document.createElement("label");
        pill.className = "filter-pill";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = cat;

        input.addEventListener("change", async () => {
          if (input.checked) {
            activeCategories.add(cat);
            pill.classList.add("active");
          } else {
            activeCategories.delete(cat);
            pill.classList.remove("active");
          }

          gridEl.innerHTML = "";
          visibleCount = 0;

          if (activeCategories.size > 0 && nextPath)
            await loadAllPages();

          renderCards();
          renderCards();
          sendHeight();
        });

        pill.appendChild(input);
        pill.appendChild(document.createTextNode(cat));
        filtersEl.appendChild(pill);
      });
  }

  async function loadAllPages() {
    while (nextPath) {
      const data = await fetchPage(nextPath);
      allPosts.push(...(data.items || []));

      if (data.pagination?.nextPageUrl) {
        const u = data.pagination.nextPageUrl;
        nextPath = u.includes("format=") ? u : u + "&format=json-pretty";
      } else nextPath = null;
    }
  }

  function getFiltered() {
    if (activeCategories.size === 0) return allPosts;
    return allPosts.filter(p =>
      p.categories?.some(c => activeCategories.has(c))
    );
  }

  /* ---------------- RENDER CARDS ---------------- */
  function renderCards() {
    const filtered = getFiltered();
    const slice = filtered.slice(visibleCount, visibleCount + BATCH);

    slice.forEach(post => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = BASE + post.fullUrl;
      a.target = "_top";

      a.innerHTML = `
        <div class="card-inner">
          <div class="card-media-wrap">
            <img class="card-img" src="${post.assetUrl}" loading="lazy" alt="${post.title}">
            <div class="card-media-overlay"></div>
          </div>
          <div class="card-text">
            <div class="card-category">${(post.categories || []).join(" · ")}</div>
            <h3 class="card-title">${post.title}</h3>
            <p class="card-excerpt">${(post.excerpt || "").replace(/<[^>]+>/g,"")}</p>
          </div>
        </div>
      `;

      gridEl.appendChild(a);
      observer.observe(a);
    });

    visibleCount += BATCH;
  }

  /* Fade-in */
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("visible");
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });

  /* Infinite Scroll */
  const sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  gridEl.after(sentinel);

  const scrollObs = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;

    const filtered = getFiltered();
    if (visibleCount >= filtered.length) return;

    renderCards();
    sendHeight();
  });
  scrollObs.observe(sentinel);

  loadInitial();

})();
</script>

<!-- HEIGHT MESSAGE -->
<script>
function sendHeight(){
  parent.postMessage({ portfolioHeight: document.documentElement.scrollHeight }, "*");
}
new MutationObserver(sendHeight).observe(document.body, { childList:true, subtree:true });
window.addEventListener("load", sendHeight);
setInterval(sendHeight, 300);
</script>

</body>
</html>
