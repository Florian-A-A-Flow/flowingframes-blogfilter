<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #1B1B1B;
      --card-bg: #1B1B1B;
      --text-main: #f5f5f5;
      --text-muted: #a0a0a0;
      --accent: #ffffff;
      --border-radius: 10px;
      --transition-fast: 0.22s ease-out;
      --shadow-hover: 0 6px 16px rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0 60px;
      background: var(--bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    #portfolio-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px;
    }

    #filterBar {
      margin-bottom: 32px;
    }

    .filter-group-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    #categoryFilters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, auto));
      gap: 14px 10px;
    }

    .filter-pill {
      position: relative;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.22s ease-out;
      text-align: center;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .filter-pill input {
      opacity: 0;
      position: absolute;
      pointer-events: none;
    }

    .filter-pill:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .filter-pill.active {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.75);
      color: #fff;
    }

    .portfolio-grid {
      display: grid;
      gap: 34px;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }

    .card {
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      transition: transform 0.22s ease-out,
                  box-shadow 0.22s ease-out;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.015);
      box-shadow: var(--shadow-hover);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .card:hover .card-img {
      transform: scale(1.06);
      filter: saturate(1.05);
    }

    .card-text {
      padding: 18px 18px 20px;
    }

    .card-category {
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 20px;
      margin: 0 0 6px;
    }

    .card-excerpt {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    #loadMoreBtn {
      margin: 40px auto 0;
      display: none;
      background: #ffffff;
      color: #000000;
      padding: 14px 28px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: 0.22s ease-out;
    }

    #loadMoreBtn:hover {
      transform: translateY(-2px);
    }

    #statusMessage {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
<div id="portfolio-wrapper">
  <div id="filterBar">
    <div class="filter-group">
      <div class="filter-group-label">Kategorien</div>
      <div id="categoryFilters"></div>
    </div>
  </div>

  <div id="portfolioGrid" class="portfolio-grid"></div>

  <button id="loadMoreBtn">Mehr laden</button>

  <div id="statusMessage"></div>
</div>

<script>
(function () {

  const BASE = "https://www.flowingframes.media";
  const PROXY =
    "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";

  let allPosts = [];
  let visibleCount = 50;
  let nextPath = "/all-projekte?format=json-pretty";
  let activeCategories = new Set();

  const gridEl = document.getElementById("portfolioGrid");
  const filtersEl = document.getElementById("categoryFilters");
  const loadMoreBtn = document.getElementById("loadMoreBtn");
  const statusEl = document.getElementById("statusMessage");

  /* ---------- FETCH FIX (robust) ---------- */
  async function fetchPage(path) {
    const isAbsolute = /^https?:\/\//i.test(path);
    const finalUrl = isAbsolute ? path : BASE + path;
    const full = PROXY + encodeURIComponent(finalUrl);

    const res = await fetch(full);
    if (!res.ok) {
      throw new Error("Fehler beim Laden: " + res.status);
    }
    return res.json();
  }

  function getExcerptText(post) {
    if (!post.excerpt) return "";
    return post.excerpt.replace(/<[^>]+>/g, "").trim();
  }

  function getCategoryLabel(post) {
    if (Array.isArray(post.categories) && post.categories.length > 0) {
      return post.categories.join(" · ");
    }
    return "";
  }

  function buildFilters() {
    filtersEl.innerHTML = "";

    const counts = {};
    allPosts.forEach((p) => {
      (p.categories || []).forEach((c) => {
        counts[c] = (counts[c] || 0) + 1;
      });
    });

    const sorted = Object.keys(counts).sort((a, b) =>
      counts[b] !== counts[a] ? counts[b] - counts[a] :
      a.localeCompare(b, "de", { sensitivity: "base" })
    );

    sorted.forEach((cat) => {
      const label = document.createElement("label");
      label.className = "filter-pill";

      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = cat;

      input.addEventListener("change", () => {
        if (input.checked) {
          activeCategories.add(cat);
          label.classList.add("active");
        } else {
          activeCategories.delete(cat);
          label.classList.remove("active");
        }
        renderPosts();
      });

      const text = document.createElement("span");
      text.textContent = cat;

      label.appendChild(input);
      label.appendChild(text);
      filtersEl.appendChild(label);
    });
  }

  function getFilteredPosts() {
    if (activeCategories.size === 0) return allPosts;
    return allPosts.filter((p) =>
      Array.isArray(p.categories)
      && p.categories.some((c) => activeCategories.has(c))
    );
  }

  function renderPosts() {
    const filtered = getFilteredPosts();
    const toShow = filtered.slice(0, visibleCount);

    gridEl.innerHTML = "";

    toShow.forEach((p) => {
      const href = BASE + p.fullUrl;

      const a = document.createElement("a");
      a.className = "card";
      a.href = href;
      a.target = "_top";
      a.rel = "noopener";

      const img = document.createElement("img");
      img.className = "card-img";
      img.src = p.assetUrl;
      img.alt = p.title || "";
      img.loading = "lazy";

      const textBox = document.createElement("div");
      textBox.className = "card-text";

      const catEl = document.createElement("div");
      catEl.className = "card-category";
      catEl.textContent = getCategoryLabel(p);

      const titleEl = document.createElement("h3");
      titleEl.className = "card-title";
      titleEl.textContent = p.title || "";

      const excerptEl = document.createElement("p");
      excerptEl.className = "card-excerpt";
      excerptEl.textContent = getExcerptText(p);

      textBox.appendChild(catEl);
      textBox.appendChild(titleEl);
      if (excerptEl.textContent) textBox.appendChild(excerptEl);

      a.appendChild(img);
      a.appendChild(textBox);
      gridEl.appendChild(a);
    });

    loadMoreBtn.style.display =
      filtered.length > visibleCount || nextPath ? "block" : "none";

    statusEl.textContent = filtered.length === 0
      ? "Keine Projekte für die gewählten Kategorien."
      : "";

    sendHeight();
  }

  async function loadInitial() {
    try {
      statusEl.textContent = "Lade Projekte …";

      while (nextPath && allPosts.length < 50) {
        const data = await fetchPage(nextPath);

        allPosts = allPosts.concat(data.items || []);

        if (data.pagination?.nextPageUrl) {
          nextPath =
            data.pagination.nextPageUrl.includes("format=")
            ? data.pagination.nextPageUrl
            : data.pagination.nextPageUrl + "&format=json-pretty";
        } else {
          nextPath = null;
        }
      }

      buildFilters();
      renderPosts();
      statusEl.textContent = "";

    } catch (error) {
      console.error(error);
      statusEl.textContent = "Fehler beim Laden.";
    }
  }

  async function handleLoadMore() {
    if (nextPath) {
      try {
        const data = await fetchPage(nextPath);
        allPosts = allPosts.concat(data.items || []);

        if (data.pagination?.nextPageUrl) {
          nextPath = data.pagination.nextPageUrl.includes("format=")
            ? data.pagination.nextPageUrl
            : data.pagination.nextPageUrl + "&format=json-pretty";
        } else {
          nextPath = null;
        }
      } catch (e) {
        console.error(e);
      }
    }

    visibleCount += 50;
    renderPosts();
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadMoreBtn.addEventListener("click", handleLoadMore);
    loadInitial();
  });

  /* --------- HEIGHT TO PARENT --------- */
  function sendHeight() {
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage({ portfolioHeight: height }, "*");
  }

  const obs = new MutationObserver(sendHeight);
  obs.observe(document.body, { subtree: true, childList: true });

  window.addEventListener("load", sendHeight);

})();
</script>

</body>
</html>
