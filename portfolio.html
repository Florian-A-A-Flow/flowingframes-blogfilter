<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg: #1B1B1B;
  --card-bg: #1B1B1B;
  --text-main: #f5f5f5;
  --text-muted: #a0a0a0;
  --border-radius: 10px;
  --transition-fast: 0.22s ease-out;
  --shadow-hover: 0 6px 16px rgba(0,0,0,0.3);
}

/* Basic Reset */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 40px 0 60px;
  background: var(--bg);
  color: var(--text-main);
  font-family: system-ui, Helvetica, Arial, sans-serif;
}

/* Wrapper für den Content (nur Grid + Status) */
#portfolio-wrapper {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 16px;
}

/* FILTER BAR – jetzt global, außerhalb des Wrappers */
#filterBar {
  margin: 0 auto 32px;
  max-width: 1400px;
  padding: 0 16px;
  position: relative; /* Basis für Indikatoren */
}

.filter-group {
  position: relative;
}

.filter-group-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

/* Desktop: Grid-Layout für Kategorien */
#categoryFilters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, auto));
  gap: 12px;
}

.filter-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--text-muted);
  cursor: pointer;
  transition: .25s;
  white-space: nowrap;
}

.filter-pill input {
  opacity: 0;
  pointer-events: none;
  position: absolute;
}

.filter-pill:hover {
  border-color: rgba(255,255,255,0.35);
  transform: translateY(-1px);
}

.filter-pill.active {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.65);
  color: white;
}

/* Scroll-Indikatoren (werden nur auf Mobile sichtbar gemacht) */
.filter-scroll-indicator {
  position: absolute;
  top: 26px; /* Desktop: ungefähr Mitte der Pills */
  bottom: 0;
  width: 24px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s ease;
  z-index: 2;
}

.filter-scroll-indicator--left {
  left: 0;
  background: linear-gradient(to right, rgba(27,27,27,1), rgba(27,27,27,0));
}

.filter-scroll-indicator--right {
  right: 0;
  background: linear-gradient(to left, rgba(27,27,27,1), rgba(27,27,27,0));
}

.filter-scroll-indicator.visible {
  opacity: 1;
}

/* GRID */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px,1fr));
  gap: 34px;
  opacity: 1;
  transition: opacity .35s ease;
}

.portfolio-grid.fade-out {
  opacity: 0;
}

/* CARD */
.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--card-bg);
  border-radius: var(--border-radius);
  overflow: hidden;
  transform: translateY(20px);
  opacity: 0;
  transition: opacity .6s ease, transform .6s ease, box-shadow .35s ease;
}

/* Hover-Schatten */
.card:hover {
  box-shadow: var(--shadow-hover);
}

.card.visible {
  opacity: 1;
  transform: translateY(0);
}

.card-inner {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.card-media-wrap {
  position: relative;
  overflow: hidden;
  border-radius: var(--border-radius);
}

.card-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  transition: transform .45s ease, filter .45s ease;
}

.card-media-overlay {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(circle at center,
             transparent 0%, rgba(0,0,0,0.4) 80%);
  transition: opacity .45s ease;
}

.card:hover .card-img {
  transform: scale(1.06);
  filter: saturate(1.1);
}

.card:hover .card-media-overlay {
  opacity: 1;
}

.card-text {
  padding: 18px 18px 20px;
}

.card-category {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.card-title {
  font-size: 20px;
  margin: 0 0 6px;
}

.card-excerpt {
  font-size: 13px;
  color: var(--text-muted);
  margin: 0;
}

/* STATUS */
#statusMessage {
  margin-top: 24px;
  color: var(--text-muted);
  text-align: center;
}

/* ============================================================
   MOBILE – kompakter + Swipe-Kategorien + Floating Bottom-Bar
   ============================================================ */
@media (max-width: 768px) {

  body {
    padding: 24px 0 110px; /* extra Platz unten für Floating-Bar */
  }

  /* Floating Bottom-Bar: komplett fix am unteren Bildschirmrand */
  #filterBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 16px;
    z-index: 40;
    margin: 0;
    padding: 0 16px;
    max-width: none;
    background: transparent;
    pointer-events: none; /* nur die Bar selbst klickbar machen */
  }

  #filterBar .filter-group {
    background: linear-gradient(to bottom, rgba(27,27,27,0.96), rgba(27,27,27,0.94));
    backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 8px 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.65);
    pointer-events: auto; /* Inhalte sind klickbar */
  }

  /* Mini-Mode beim Scrollen */
  #filterBar.compact .filter-group {
    padding: 5px 8px;
    transform: translateY(2px) scale(0.96);
    transform-origin: center;
  }

  #filterBar.compact .filter-group-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    opacity: 0.9;
  }

  .filter-group-label {
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  /* Kleiner Pfeil für Dropdown-Indikator */
  .filter-group-label::after {
    content: "▾";
    font-size: 12px;
    margin-left: 8px;
    transition: transform .2s ease;
  }

  #filterBar.filters-open .filter-group-label::after {
    transform: rotate(180deg);
  }

  /* Horizontale Kategorie-Swipe-Navigation (Dropdown) */
  #categoryFilters {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 8px;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;

    max-height: 0;
    opacity: 0;
    pointer-events: none;
    transition: max-height .25s ease, opacity .25s ease;
  }

  #categoryFilters::-webkit-scrollbar {
    display: none;
  }

  /* Wenn Dropdown geöffnet ist */
  #filterBar.filters-open #categoryFilters {
    max-height: 60px;
    opacity: 1;
    pointer-events: auto;
  }

  /* Mobile-Pill-Optik */
  .filter-pill {
    padding: 6px 14px;
    font-size: 11px;
    border-radius: 999px;
  }

  /* Scroll-Indikatoren auf die Floating-Bar anpassen */
  .filter-scroll-indicator {
    top: 22px;
    bottom: 6px;
  }

  .portfolio-grid {
    gap: 18px;
    grid-template-columns: 1fr;
  }

  .card-text {
    padding: 14px 14px 16px;
  }

  .card-title {
    font-size: 17px;
  }

  .card-category {
    font-size: 10px;
  }

  .card-excerpt {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<!-- Floating / Desktop FilterBar – jetzt direkt unter <body> -->
<div id="filterBar">
  <div class="filter-group">
    <div class="filter-group-label">Kategorien</div>
    <div id="categoryFilters"></div>
    <!-- Scroll-Indikatoren -->
    <div class="filter-scroll-indicator filter-scroll-indicator--left"></div>
    <div class="filter-scroll-indicator filter-scroll-indicator--right"></div>
  </div>
</div>

<div id="portfolio-wrapper">
  <div id="portfolioGrid" class="portfolio-grid"></div>
  <div id="statusMessage"></div>
</div>

<script>
/* ============================================================
   PORTFOLIO ENGINE — FlowingFrames Infinite Scroll Version
   ============================================================ */

(function() {

  const BASE = "https://www.flowingframes.media";
  const PROXY = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";

  let allPosts = [];
  let nextPath = "/all-projekte?format=json-pretty";
  let activeCategories = new Set();

  const gridEl        = document.getElementById("portfolioGrid");
  const filtersEl     = document.getElementById("categoryFilters");
  const statusEl      = document.getElementById("statusMessage");
  const filterBarEl   = document.getElementById("filterBar");
  const filterLabelEl = document.querySelector(".filter-group-label");
  const indicatorLeft  = document.querySelector(".filter-scroll-indicator--left");
  const indicatorRight = document.querySelector(".filter-scroll-indicator--right");

  let visibleCount = 0;
  const BATCH = 30;


  async function fetchPage(path) {
    const url = PROXY + encodeURIComponent(BASE + path);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Fehler: " + res.status);
    return res.json();
  }

  async function loadAllPages() {
    while (nextPath) {
      const data = await fetchPage(nextPath);
      allPosts = allPosts.concat(data.items || []);

      if (data.pagination && data.pagination.nextPageUrl) {
        const u = data.pagination.nextPageUrl;
        nextPath = u.includes("format=") ? u : u + "&format=json-pretty";
      } else {
        nextPath = null;
      }
    }
  }

  function buildFilters() {
    filtersEl.innerHTML = "";

    const counts = {};
    allPosts.forEach(p =>
      (p.categories || []).forEach(cat =>
        counts[cat] = (counts[cat] || 0) + 1
      )
    );

    Object.keys(counts)
      .sort((a,b) => counts[b]-counts[a] || a.localeCompare(b))
      .forEach(cat => {

        const label = document.createElement("label");
        label.className = "filter-pill";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = cat;

        input.addEventListener("change", async () => {
          if (input.checked) {
            activeCategories.add(cat);
            label.classList.add("active");
          } else {
            activeCategories.delete(cat);
            label.classList.remove("active");
          }

          gridEl.classList.add("fade-out");
          await new Promise(r => setTimeout(r, 250));

          if (activeCategories.size > 0 && nextPath)
            await loadAllPages();

          visibleCount = 0;
          gridEl.innerHTML = "";

          renderCards();
          gridEl.classList.remove("fade-out");

          setTimeout(sendHeight, 50);
        });

        const span = document.createElement("span");
        span.textContent = cat;

        label.appendChild(input);
        label.appendChild(span);
        filtersEl.appendChild(label);
      });

    // Nach Aufbau der Pills direkt Scroll-Indikatoren berechnen
    updateScrollIndicators();
  }

  function getFilteredPosts() {
    if (activeCategories.size === 0) return allPosts;
    return allPosts.filter(p =>
      p.categories && p.categories.some(c => activeCategories.has(c))
    );
  }

  function renderCards() {
    const filtered = getFilteredPosts();
    const newEnd = visibleCount + BATCH;
    const slice = filtered.slice(visibleCount, newEnd);

    slice.forEach(post => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = BASE + post.fullUrl;
      a.target = "_top";

      const inner = document.createElement("div");
      inner.className = "card-inner";

      const media = document.createElement("div");
      media.className = "card-media-wrap";

      const img = document.createElement("img");
      img.className = "card-img";
      img.src = post.assetUrl;
      img.alt = post.title || "";
      img.loading = "lazy";

      const overlay = document.createElement("div");
      overlay.className = "card-media-overlay";

      media.appendChild(img);
      media.appendChild(overlay);

      const text = document.createElement("div");
      text.className = "card-text";

      const catEl = document.createElement("div");
      catEl.className = "card-category";
      catEl.textContent = (post.categories || []).join(" · ");

      const titleEl = document.createElement("h3");
      titleEl.className = "card-title";
      titleEl.textContent = post.title || "";

      const excerptEl = document.createElement("p");
      excerptEl.className = "card-excerpt";
      excerptEl.textContent = post.excerpt
        ? post.excerpt.replace(/<[^>]+>/g,"")
        : "";

      text.appendChild(catEl);
      text.appendChild(titleEl);
      if (excerptEl.textContent) text.appendChild(excerptEl);

      inner.appendChild(media);
      inner.appendChild(text);
      a.appendChild(inner);
      gridEl.appendChild(a);

      observeCard(a);
    });

    visibleCount = newEnd;
    statusEl.textContent = filtered.length === 0
      ? "Keine Projekte für die gewählten Kategorien."
      : "";
  }

  const cardObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("visible");
        cardObserver.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });

  function observeCard(card) {
    cardObserver.observe(card);
  }

  const sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  gridEl.after(sentinel);

  const scrollObserver = new IntersectionObserver(async (entries) => {
    if (!entries[0].isIntersecting) return;

    const filtered = getFilteredPosts();
    if (visibleCount >= filtered.length) return;

    renderCards();
    sendHeight();
  });

  scrollObserver.observe(sentinel);

  async function loadInitial() {
    statusEl.textContent = "Lade Projekte …";

    while (nextPath && allPosts.length < 100) {
      const data = await fetchPage(nextPath);
      allPosts = allPosts.concat(data.items || []);

      if (data.pagination && data.pagination.nextPageUrl) {
        const u = data.pagination.nextPageUrl;
        nextPath = u.includes("format=") ? u : u + "&format=json-pretty";
      } else {
        nextPath = null;
      }
    }

    buildFilters();
    renderCards();
    renderCards();

    statusEl.textContent = "";
  }

  /* ---------------------------
     Mobile: Dropdown-Filter + Mini-Mode + Scroll-Indikatoren
  ---------------------------- */

  // Dropdown Toggle beim Klick auf Label
  if (filterLabelEl) {
    filterLabelEl.addEventListener("click", () => {
      filterBarEl.classList.toggle("filters-open");
      setTimeout(updateScrollIndicators, 50);
    });
  }

  // Mini-Mode (für Floating Bottom-Bar: Bar schrumpft leicht beim Scrollen)
  window.addEventListener("scroll", () => {
    const y = window.scrollY || document.documentElement.scrollTop;
    if (y > 80) {
      filterBarEl.classList.add("compact");
    } else {
      filterBarEl.classList.remove("compact");
    }
  });

  // Scroll-Indikatoren basierend auf Scrollposition von #categoryFilters
  function updateScrollIndicators() {
    if (!filtersEl) return;

    const scrollLeft  = filtersEl.scrollLeft;
    const maxScroll   = filtersEl.scrollWidth - filtersEl.clientWidth;

    if (indicatorLeft) {
      indicatorLeft.classList.toggle("visible", scrollLeft > 2);
    }
    if (indicatorRight) {
      indicatorRight.classList.toggle("visible", scrollLeft < maxScroll - 2);
    }
  }

  if (filtersEl) {
    filtersEl.addEventListener("scroll", updateScrollIndicators);
  }

  loadInitial();
})();
</script>

<!-- HEIGHT MESSAGE TO SQUARESPACE -->
<script>
function sendHeight() {
  const h = document.documentElement.scrollHeight;
  parent.postMessage({ portfolioHeight: h }, "*");
}

new MutationObserver(() => sendHeight())
  .observe(document.body, { childList: true, subtree: true });

setInterval(sendHeight, 300);
window.addEventListener("load", sendHeight);
</script>

</body>
</html>
