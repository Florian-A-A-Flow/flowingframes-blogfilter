<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Flowing Frames</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg: #1B1B1B;
  --card-bg: #1B1B1B;
  --text-main: #f5f5f5;
  --text-muted: #a0a0a0;
  --border-radius: 12px;
  --transition-fast: 0.22s ease-out;
  --shadow-hover: 0 6px 16px rgba(0,0,0,0.3);

  --pill-bg: rgba(255,255,255,0.06);
  --pill-border: rgba(255,255,255,0.18);
  --pill-active-bg: rgba(255,255,255,0.22);
}

/* Basic Reset */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 40px 0 60px;
  background: var(--bg);
  color: var(--text-main);
  font-family: system-ui, Helvetica, Arial, sans-serif;
}

/* Wrapper */
#portfolio-wrapper {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ============================================================
   FILTER BAR — DESKTOP
   ============================================================ */
#filterBar {
  margin-bottom: 32px;
}

.filter-group-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* MODERN DESKTOP GRID */
#categoryFilters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.filter-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .25s;
  white-space: nowrap;
  backdrop-filter: blur(6px);
}

.filter-pill:hover {
  border-color: rgba(255,255,255,0.35);
  background: rgba(255,255,255,0.12);
}

.filter-pill.active {
  background: var(--pill-active-bg);
  border-color: rgba(255,255,255,0.65);
  color: white;
}

.filter-pill input {
  opacity: 0;
  pointer-events: none;
  position: absolute;
}

/* ============================================================
   MOBILE — Sticky Swipe-Bar
   ============================================================ */
@media (max-width: 768px) {

  #filterBar {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 12px 0 16px;
    background: linear-gradient(var(--bg), var(--bg));
    backdrop-filter: blur(12px);
  }

  #categoryFilters {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 10px;
    padding: 4px 4px 10px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  #categoryFilters::-webkit-scrollbar {
    display: none;
  }

  /* Larger mobile pills */
  .filter-pill {
    padding: 10px 20px;
    font-size: 13px;
    border-radius: 999px;
  }

  /* Fade shadows left & right */
  #filterBar::before,
  #filterBar::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 24px;
    pointer-events: none;
    z-index: 60;
  }

  #filterBar::before {
    left: 0;
    background: linear-gradient(to right, var(--bg) 0%, transparent 100%);
  }

  #filterBar::after {
    right: 0;
    background: linear-gradient(to left, var(--bg) 0%, transparent 100%);
  }
}

/* ============================================================
   GRID + CARDS
   ============================================================ */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px,1fr));
  gap: 34px;
  opacity: 1;
  transition: opacity .35s ease;
}

.portfolio-grid.fade-out {
  opacity: 0;
}

.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--card-bg);
  border-radius: var(--border-radius);
  overflow: hidden;
  transform: translateY(20px);
  opacity: 0;
  transition: opacity .6s ease, transform .6s ease, box-shadow .35s ease;
}

.card:hover {
  box-shadow: var(--shadow-hover);
}

.card.visible {
  opacity: 1;
  transform: translateY(0);
}

.card-media-wrap {
  position: relative;
  overflow: hidden;
  border-radius: var(--border-radius);
}

.card-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  transition: transform .45s ease, filter .45s ease;
}

.card-media-overlay {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.45) 80%);
  transition: opacity .45s ease;
}

.card:hover .card-img {
  transform: scale(1.06);
  filter: saturate(1.15);
}

.card:hover .card-media-overlay {
  opacity: 1;
}

.card-text {
  padding: 18px 18px 20px;
}

.card-category {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.card-title {
  font-size: 20px;
  margin: 0 0 6px;
}

.card-excerpt {
  font-size: 13px;
  color: var(--text-muted);
}

#statusMessage {
  margin-top: 24px;
  text-align: center;
  color: var(--text-muted);
}

/* Mobile layout adjustments */
@media (max-width: 768px) {
  .portfolio-grid { gap: 20px; grid-template-columns: 1fr; }
  .card-text { padding: 14px 14px 16px; }
  .card-title { font-size: 18px; }
  .card-category { font-size: 10px; }
  .card-excerpt { font-size: 12px; }
}
</style>
</head>

<body>

<div id="portfolio-wrapper">

  <div id="filterBar">
    <div class="filter-group">
      <div class="filter-group-label">Kategorien</div>
      <div id="categoryFilters"></div>
    </div>
  </div>

  <div id="portfolioGrid" class="portfolio-grid"></div>
  <div id="statusMessage"></div>

</div>

<script>
/* ============================================================
   PORTFOLIO ENGINE — Infinite Scroll + Filter
   ============================================================ */

(function() {

  const BASE = "https://www.flowingframes.media";
  const PROXY = "https://flowingframes-proxy.florian-augustus-alexander.workers.dev/?url=";

  let allPosts = [];
  let nextPath = "/all-projekte?format=json-pretty";
  let activeCategories = new Set();

  const gridEl = document.getElementById("portfolioGrid");
  const filtersEl = document.getElementById("categoryFilters");
  const statusEl = document.getElementById("statusMessage");

  let visibleCount = 0;
  const BATCH = 30;


  async function fetchPage(path) {
    const url = PROXY + encodeURIComponent(BASE + path);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Fehler: " + res.status);
    return res.json();
  }

  async function loadAllPages() {
    while (nextPath) {
      const data = await fetchPage(nextPath);
      allPosts = allPosts.concat(data.items || []);
      if (data.pagination?.nextPageUrl) {
        const u = data.pagination.nextPageUrl;
        nextPath = u.includes("format=") ? u : u + "&format=json-pretty";
      } else nextPath = null;
    }
  }

  function buildFilters() {
    filtersEl.innerHTML = "";

    const counts = {};
    allPosts.forEach(post =>
      (post.categories || []).forEach(c =>
        counts[c] = (counts[c] || 0) + 1
      )
    );

    Object.keys(counts)
      .sort((a,b) => counts[b]-counts[a] || a.localeCompare(b))
      .forEach(cat => {

        const label = document.createElement("label");
        label.className = "filter-pill";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = cat;

        input.addEventListener("change", async () => {
          input.checked
            ? (activeCategories.add(cat), label.classList.add("active"))
            : (activeCategories.delete(cat), label.classList.remove("active"));

          gridEl.classList.add("fade-out");
          await new Promise(r => setTimeout(r, 250));

          if (activeCategories.size > 0 && nextPath)
            await loadAllPages();

          visibleCount = 0;
          gridEl.innerHTML = "";

          renderCards();
          gridEl.classList.remove("fade-out");

          setTimeout(sendHeight, 50);
        });

        const span = document.createElement("span");
        span.textContent = cat;

        label.appendChild(input);
        label.appendChild(span);
        filtersEl.appendChild(label);
      });
  }

  function getFilteredPosts() {
    if (activeCategories.size === 0) return allPosts;
    return allPosts.filter(post =>
      post.categories?.some(c => activeCategories.has(c))
    );
  }

  function renderCards() {
    const filtered = getFilteredPosts();
    const newEnd = visibleCount + BATCH;
    const batch = filtered.slice(visibleCount, newEnd);

    batch.forEach(post => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = BASE + post.fullUrl;
      a.target = "_top";

      const inner = document.createElement("div");
      inner.className = "card-inner";

      const media = document.createElement("div");
      media.className = "card-media-wrap";

      const img = document.createElement("img");
      img.className = "card-img";
      img.src = post.assetUrl;
      img.alt = post.title;
      img.loading = "lazy";

      const ov = document.createElement("div");
      ov.className = "card-media-overlay";

      media.appendChild(img);
      media.appendChild(ov);

      const text = document.createElement("div");
      text.className = "card-text";

      const cat = document.createElement("div");
      cat.className = "card-category";
      cat.textContent = (post.categories || []).join(" · ");

      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = post.title;

      const excerpt = document.createElement("p");
      excerpt.className = "card-excerpt";
      excerpt.textContent = post.excerpt?.replace(/<[^>]+>/g, "") || "";

      text.appendChild(cat);
      text.appendChild(title);
      if (excerpt.textContent) text.appendChild(excerpt);

      inner.appendChild(media);
      inner.appendChild(text);
      a.appendChild(inner);
      gridEl.appendChild(a);

      observeCard(a);
    });

    visibleCount = newEnd;

    statusEl.textContent =
      filtered.length === 0 ? "Keine Projekte für die gewählten Kategorien." : "";
  }

  const cardObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("visible");
        cardObserver.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });

  function observeCard(card) {
    cardObserver.observe(card);
  }

  const sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  gridEl.after(sentinel);

  const scrollObserver = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    const filtered = getFilteredPosts();
    if (visibleCount < filtered.length) {
      renderCards();
      sendHeight();
    }
  });

  scrollObserver.observe(sentinel);

  async function loadInitial() {
    statusEl.textContent = "Lade Projekte …";

    while (nextPath && allPosts.length < 120) {
      const data = await fetchPage(nextPath);
      allPosts = allPosts.concat(data.items || []);
      nextPath = data.pagination?.nextPageUrl
        ? (data.pagination.nextPageUrl.includes("format=")
            ? data.pagination.nextPageUrl
            : data.pagination.nextPageUrl + "&format=json-pretty")
        : null;
    }

    buildFilters();
    renderCards();
    renderCards();
    statusEl.textContent = "";
  }

  loadInitial();

})();
</script>

<script>
function sendHeight() {
  parent.postMessage({ portfolioHeight: document.documentElement.scrollHeight }, "*");
}

new MutationObserver(sendHeight)
  .observe(document.body, { childList: true, subtree: true });

setInterval(sendHeight, 300);
window.addEventListener("load", sendHeight);
</script>

</body>
</html>
